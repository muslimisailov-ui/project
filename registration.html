<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style3.css"> </head>
<body>

<div class="reg-card">
    <h2>Регистрация</h2>
    
   <div class="input-row">
    <div class="input-group">
        <label>Имя</label>
        <input type="text" id="firstName" placeholder="Имя">
    </div>
    <div class="input-group">
        <label>Фамилия</label>
        <input type="text" id="lastName" placeholder="Фамилия">
    </div>
</div>

    <div class="input-group">
      <label>Логин</label>
       <input type="text" id="userName" placeholder="Логин">
    </div>

    <div class="input-group">
      <label>Номер телефона</label>
      <input type="tel" id="phone" placeholder="+996 --- --- ---">
    </div>

    <div class="input-group">
     <label>Пароль</label>
     <input type="password" id="password" placeholder="****">
    </div>

    <button class="btn-reg" onclick="registerUser()">Зарегистрироваться</button>
</div>

<script>
    function registerUser() {
        const fName = document.getElementById('firstName').value;
        const lName = document.getElementById('lastName').value;
        
        if (fName && lName) {
            localStorage.setItem('user_name', fName + " " + lName);
            window.location.href = 'index.html';
        } else {
            alert('Пожалуйста,напишите своё имя!');
        }
    }
</script>

<script>
    window.onload = function() {
        const savedName = localStorage.getItem('user_name');
        const authBtn = document.getElementById('authBtn'); 

        if (savedName && authBtn) {
            authBtn.innerText = savedName;
            authBtn.href = "#"; 
            authBtn.style.background = "#28a745"; 

            const logoutBtn = document.createElement('button');
            logoutBtn.innerText = 'Выход';
            
            logoutBtn.style.cssText = "margin-left:10px; padding:10px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;";

            logoutBtn.onclick = function() {
                localStorage.removeItem('user_name'); 
                window.location.reload(); 
            };

            authBtn.after(logoutBtn);
        }
    };
</script>

<script>
    function registerUser() {
        const uName = document.getElementById('userName').value; 
        const pass = document.getElementById('password').value; 

        if (uName && pass) {
            localStorage.setItem('registered_user', uName);
            localStorage.setItem('registered_pass', pass);
            
            alert("Вы зарегистрировались! Теперь войдите, используя свой логин.");
            window.location.href = 'login.html'; 
        } else {
            alert("Введите имя пользователя и пароль!");
        }
    }
</script>

</body>
</html>
